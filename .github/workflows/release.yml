name: Derle

# Sürüm yayınlama elle yapılırsa her seferinde tek bir Windows makinesine bağımlı kalırsın:
# o makinenin araç seti, o anki ImGui submodule'i ve o anki registry durumu derlemeyi belirler.
# Burada her etiket kendi kendine, temiz bir kurulumda derlenir ve exe'i sürüm olarak
# yayınlar.
#
# Kullanım:
#   git tag v1.0.1
#   git push origin v1.0.1

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  derle:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # Arayüz kütüphanesi submodule; submodule olmadan checkout eksik dosyalarla döner.
          submodules: recursive

      - name: Visual Studio kurulum bilgisi
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

      - name: Derle ve test et
        run: cmd /c build.bat

      # Üretilen registry tablosu kaynak kodla tutarlı olmalı. Üretici yanlış bir
      # ayarı sessizce atlarsa tablo eksik kalır ama derleme yine de yeşildir;
      # burada yeniden üretip fark olup olmadığına bakılıyor.
      - name: Registry tablosu güncel mi
        shell: pwsh
        run: |
          $degisiklik = git diff --stat -- docs/tweaks-registry.md
          if ($degisiklik) {
            Write-Host "docs/tweaks-registry.md kaynak kodla uyumsuz:"
            Write-Host $degisiklik
            Write-Host "Betik zaten yeniden uretti. Bu dosyayi elle duzenlemeyin."
            throw "Registry tablosu guncellenmemis; yukaridaki farki commit'leyin."
          }
          Write-Host "tablo kaynak kodla eslesiyor"

      - name: Sürüm bilgisini doğrula
        shell: pwsh
        run: |
          $f = Get-Item build\TENGRI.exe
          if (-not $f) { throw "build\TENGRI.exe uretilmedi" }
          Write-Host "boyut    : $([math]::Round($f.Length/1KB)) KB"
          Write-Host "urun    : $($f.VersionInfo.ProductName)"
          Write-Host "surum   : $($f.VersionInfo.ProductVersion)"
          $v = $f.VersionInfo.ProductVersion
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $beklenen = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($v -ne $beklenen) {
              throw "Surum uyusmadi: etiket '$beklenen', exe '$v'. brand.hpp / tengri.rc guncellenmeli."
            }
          }

      # Uygulamanın "yeni sürüm var" diyebilmesi için tek gereken bu küçücük dosya.
      # Neden JSON: exe'i doğrudan sürüm sayfasından indirmeden önce boyutunu ve
      # SHA-256'sını bilmek istiyoruz. İki değer de derlendikten SONRA hesaplanıyor,
      # yani kaynakta yazılı duran bir sabit değil; sürtürülmüş bir exe ile yanlış
      # hash'i ellerinde tutan iki ayrı hata burada olanaksız.
      #
      # Bu adım etiketli/etiketsiz her koşumda çalışır: etiketsiz koşulda sürüm
      # yayınlanmaz ama dosya yine de üretilir ve ayrıştırılabilir olduğu doğrulanır.
      # Böylece bozuk bir şablon, sürüm günü patlamak yerine burada yakalanır.
      - name: Güncelleme bildirimi (latest.json)
        shell: pwsh
        run: |
          $f = Get-Item build\TENGRI.exe
          if (-not $f) { throw "build\TENGRI.exe yok" }

          # İndirme adresi etiketten türetilir ve GitHub'ın kendi biçimidir; depoyu
          # kullanan kişi adı değiştiremeyeceği için burada elle yazılması güvenlidir.
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { "v$($f.VersionInfo.ProductVersion)" }
          # GITHUB_REPOSITORY zaten "owner/name" biçiminde.
          $url  = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/TENGRI.exe"

          $notesFile = "docs\release-notes\$tag.md"
          # Kodlama açıkça belirtiliyor: betik UTF-8'i varsayılan kod sayfasıyla
          # okursa Türkçe metin bozuklaşır ve uygulamanın göreceği yayın notları
          # tanınamaz hâle gelir.
          $notes = if (Test-Path $notesFile) { (Get-Content $notesFile -Raw -Encoding utf8).TrimEnd() } else { "Sürüm $tag" }

          $bildirim = [ordered]@{
            version = $tag.TrimStart('v')
            sha256  = (Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()
            size    = $f.Length
            url     = $url
            notes   = $notes
          }

          # BOM'suz UTF-8 yazılıyor: uygulama basit bir ayraç ayrıştırması yapıyor ve
          # baştaki üç bayt ilk alan adını okunamaz kılardı.
          $json = $bildirim | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "build\latest.json"),
            $json,
            (New-Object System.Text.UTF8Encoding($false))
          )

          # Yalnızca yazmış olmak için yazılmış olmasın: aynı anda hem alan adlarını
          # hem de hash'in uzunluğunu burada doğruluyoruz. Uygulama 64 karakterlik
          # onaltılık dizinin dışına çıkan bildirimi güvenilmez sayar.
          $ok = Get-Content build\latest.json -Raw | ConvertFrom-Json
          if ($ok.sha256.Length -ne 64) { throw "sha256 beklenen uzunlukta degil: $($ok.sha256.Length)" }
          if ([string]::IsNullOrWhiteSpace($ok.url)) { throw "url bos" }
          if ($ok.size -le 0) { throw "size gecersiz: $($ok.size)" }
          Write-Host "latest.json: surum=$($ok.version) boyut=$($ok.size) sha256=$($ok.sha256.Substring(0,16))..."

      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME

          # Türkçe notlar gh'ye bozulmadan GECMELI. Ölçümle bulundu:
          #   --notes "TENGRI İ"        (tek satır)  -> DOĞRU  (C4 B0)
          #   --notes "## TENGRİ ..."   (çok satır) -> BOZUK
          # Tek satırda sorun görünmüyor; hata ancak GERÇEK notlar (yüzlerce
          # satır) yayınlandığında ortaya çıkıyor. Bu yüzden doğrulama da tek
          # satırla değil, gerçek not dosyasıyla yapılmalı.
          #
          # --notes-file notu BAYT BAYT okur ve çok satırlı dosyada doğru
          # çıktı. (Önceki yorumda "--notes-file de bozuyor" denmişti; bu ölçüm
          # hatasıydı — testte Out-String satır sonlarını dönüştürüyordu ve
          # ben onu bozulma sandım.)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)

          $notesFile = "docs\release-notes\$tag.md"
          if (-not (Test-Path $notesFile)) {
            $notesFile = "$env:RUNNER_TEMP\release-notes.md"
            [System.IO.File]::WriteAllText(
              $notesFile,
              "Sürüm $tag",
              [System.Text.UTF8Encoding]::new($false)
            )
          }
          # Sürüm YENIDEN yayınlanıyorsa (ör. aynı etiket düzeltilmiş bir
          # derlemeyle tekrar gönderildiğinde) `gh release create` "a release with
          # the same tag name already exists" ile BAŞARISIZ olur ve --clobber
          # kullanılmadığı için exe hiç yüklenmez; buna karşılık latest.json
          # --clobber ile sessizce GÜNCELLENİR. Ortaya şu durum çıkar:
          # bildirim yeni exe'nin hash'ini söyler ama yerdeki exe eskidir.
          # Kullanıcının güncellemesi indirme sırasında "Sağlama değeri uyuşmuyor"
          # ile düşer ve nedeni bulmak saatler alır.
          #
          # Bu yüzden iki dosyaya da aynı yol uygulanır: sürüm varsa üstüne yaz,
          # yoksa oluştur. --clobber her iki komutta da "yoksa ekle, varsa
          # değiştir" demektir, ama create'in hata vermemesi için önce varlık
          # sorgulanır.
          gh release view $tag > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "surum zaten var; varliklar ustune yaziliyor: $tag"
            gh release edit $tag --title "TENGRI $tag" --notes-file $notesFile
            gh release upload $tag "build\TENGRI.exe" --clobber
          }
          else {
            gh release create $tag "build\TENGRI.exe" `
              --title "TENGRI $tag" `
              --notes-file $notesFile
          }

          # Güncelleme bildirimi de sürüme asetlenir; böylece uygulamanın okuduğu
          # hash, o sürümün gerçekten yayınlanmış dosyasından üretilmiş olur.
          # Sıralama önemli: exe ÖNCE yüklenmeli, bildirim SONRA. Tersi
          # yapılırsa yayın anında bildirim, henüz yüklenmemiş exe'nin hash'ini
          # taşır.
          gh release upload $tag "build\latest.json" --clobber

          # Hash tutarlılığı doğrulaması: bildirimdeki özet, YAYINLANAN dosyanın
          # gerçek özetiyle aynı olmalı. Bu iki sayı ayrıldığında uygulama
          # indirmeyi reddeder ve hata mesajı nedeni söylemez; tutarsızlığı
          # burada yakalamak, kullanıcıdan gelen "güncellemiyor" şikâyetinden
          # çok daha ucuz.
          $gercek = (Get-FileHash -Algorithm SHA256 "build\TENGRI.exe").Hash.ToLowerInvariant()
          $bildir = (Get-Content build\latest.json -Raw | ConvertFrom-Json)
          if ($bildir.sha256 -ne $gercek) {
            Write-Host "bildirim sha256 : $($bildir.sha256)"
            Write-Host "yayinlanan exe  : $gercek"
            throw "latest.json, yayinlanan exe ile eslesmiyor"
          }
          if ($bildir.size -ne (Get-Item "build\TENGRI.exe").Length) {
            throw "latest.json boyutu, yayinlanan exe ile eslesmiyor"
          }
          Write-Host "hash dogrulandi: $gercek"

          # Eksik asset sessizce geçmesin: iki dosya da listede görünmeden adım bitmez.
          # Yalnız VARLIK kontrolü yetmez: yeniden yayında eski exe yerinde kalıp
          # yeni görünür. Bu yüzden yayınlanan dosyanın özeti de yereldekiyle
          # karşılaştırılır.
          $assets = (gh release view $tag --json assets --jq '.assets[].name') -join ','
          Write-Host "yayinlanan assetler: $assets"
          foreach ($ad in @('TENGRI.exe', 'latest.json')) {
            if ($assets -notlike "*$ad*") { throw "surumde $ad yok" }
          }

          $yayinlananBoyut = (gh release view $tag --json assets --jq '.assets[] | select(.name == "TENGRI.exe") | .size')
          $yerelBoyut = (Get-Item "build\TENGRI.exe").Length
          if ("$yayinlananBoyut" -ne "$yerelBoyut") {
            throw "yayindaki exe boyutu $yayinlananBoyut, derlenen $yerelBoyut. Eski varlik kaldi mi?"
          }
          Write-Host "yayindaki exe boyutu dogrulandi: $yerelBoyut"

          # Yayınlanan notlar bozulmadan gitmiş mi? GERÇEK not dosyasıyla
          # karşılaştırılır; tek satırlık bir denemeyle DEĞİL.
          #
          # Neden gerçek dosya: ölçümde --notes TEK SATIRDA doğru, ÇOK SATIRDA
          # bozuk çıktı. Kısa bir probe her zaman geçer ve hatayı gizler —
          # v1.5.0'ın ilk düzeltmesinde tam olarak böyle yanlış pozitif verdi.
          #
          # Karşılaştırma satır sonlarından ARINDIRILMIŞ metin üzerinden yapılır:
          # GitHub gövdeyi CRLF saklar, bayt bayt karşılaştırmak "0A 0A" ->
          # "0D 0A 0D 0A" yüzünden hizalamayı kaydırır ve doğru metni yanlışlıkla
          # bozuk sayar.
          $yayinlanan = gh release view $tag --json body --jq '.body' 2>$null | Out-String
          $beklenenBayt = [System.IO.File]::ReadAllBytes((Resolve-Path $notesFile))
          $yayinBayt = [System.Text.UTF8Encoding]::new($false).GetBytes($yayinlanan.TrimEnd("`r","`n"))

          function Normalize([byte[]]$b) {
            $s = [System.Text.Encoding]::UTF8.GetString($b)
            return ($s -replace "`r`n", "`n").TrimEnd("`n")
          }
          $normBeklenen = Normalize $beklenenBayt
          $normYayinlanan = Normalize $yayinBayt

          if ($normYayinlanan -eq $normBeklenen) {
            Write-Host "not kodlamasi dogrulandi (tum metin bayt bayt ayni, satir sonu hariç)"
          }
          else {
            # Nerede ayrıldı? Kısa bir bağlam yazdır.
            $n = [Math]::Min($normBeklenen.Length, $normYayinlanan.Length)
            $ilk = 0
            while ($ilk -lt $n -and $normBeklenen[$ilk] -eq $normYayinlanan[$ilk]) { $ilk++ }
            Write-Host "ilk fark indeksi: $ilk"
            Write-Host ("beklenen ...: " + $normBeklenen.Substring([Math]::Max(0,$ilk-10), 30))
            Write-Host ("gelen    ...: " + $normYayinlanan.Substring([Math]::Max(0,$ilk-10), 30))
            throw "release notlari kodlamasi bozuk"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}